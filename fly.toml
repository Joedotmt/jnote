app = "jnote-v2-joedotmt"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_POCKETBASE_URL = "https://joemt.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
