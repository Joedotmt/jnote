<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<meta name="description" content="A private, encrypted notes app." />
		<meta name="theme-color" content="#121316" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/icon-32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="192x192"
			href="%sveltekit.assets%/icons/icon-192.png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="JNote" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<script>
			// Self-hosted deployments: set pocketbaseUrl here (or build with VITE_POCKETBASE_URL)
			// and configure the account site/origins for your installation.
			// accountsOrigins must match BRIDGE_ORIGINS + HANDOFF_ORIGINS on the account site.
			window.JNOTE_CONFIG = Object.assign(
				{
					accountsOrigin: 'https://accounts.joe.mt',
					accountsOrigins: [
						'https://joe.mt',
						'https://notes.joe.mt',
						'https://jnote-v2-joedotmt.fly.dev',
						'http://localhost:5173',
						'http://localhost:4173',
						'http://127.0.0.1:5173',
						'http://127.0.0.1:4173'
					]
				},
				window.JNOTE_CONFIG
			);
			(() => {
				const publicPath = /(?:^|\/)s\/[^/]+\/?$/.test(location.pathname);
				window.__jnotePublic = publicPath;
				let secret = '';
				let handoff = '';
				let problem = '';
				if (publicPath) {
					document.documentElement.classList.add('jnote-public');
					const raw = location.hash.slice(1);
					if (/^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$/.test(raw)) secret = raw;
					if (location.hash)
						history.replaceState(history.state, '', location.pathname + location.search);
					window.__jnoteTakeShareKey = () => {
						const value = secret;
						secret = '';
						return value;
					};
					const csp = document.createElement('meta');
					csp.httpEquiv = 'Content-Security-Policy';
					csp.content =
						"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https: http://localhost:* http://127.0.0.1:*; img-src 'self' data:; base-uri 'none'; form-action 'none'";
					document.head.append(csp);
				} else {
					// Strip handed-over tokens before any external script or app module runs.
					const fragment = new URLSearchParams(location.hash.slice(1));
					if (fragment.has('joe_session')) {
						const values = fragment.getAll('joe_session');
						fragment.delete('joe_session');
						const rest = fragment.toString();
						history.replaceState(
							history.state,
							'',
							location.pathname + location.search + (rest ? '#' + rest : '')
						);
						try {
							const token = values.length === 1 ? values[0] : '';
							const payload = JSON.parse(
								atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))
							);
							if (payload.type !== 'auth') problem = 'wrong-type';
							else if (!(payload.exp > Date.now() / 1000)) problem = 'expired';
							else if ((window.JNOTE_CONFIG.accountsOrigins || []).includes(location.origin))
								handoff = token;
						} catch {
							problem = 'malformed';
						}
					}
					window.__jnoteTakeHandoffToken = () => {
						const value = handoff;
						handoff = '';
						return value;
					};
					window.__jnoteHandoffProblem = () => problem;
					for (const href of [
						'https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap',
						'https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.css'
					]) {
						const link = document.createElement('link');
						link.rel = 'stylesheet';
						link.href = href;
						document.head.append(link);
					}
					const beer = document.createElement('script');
					beer.type = 'module';
					beer.src = 'https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.js';
					document.head.append(beer);
				}
				window.__joeAccountsReady = new Promise((resolve) => {
					if (
						publicPath ||
						!(window.JNOTE_CONFIG.accountsOrigins || []).includes(location.origin)
					) {
						resolve(false);
						return;
					}
					const script = document.createElement('script');
					script.src = window.JNOTE_CONFIG.accountsOrigin + '/client.js';
					script.onload = () => resolve(true);
					script.onerror = () => resolve(false);
					document.head.append(script);
				});
			})();
		</script>
		%sveltekit.head%
		<style id="custom-css"></style>
		<script>
			(() => {
				try {
					if (window.__jnotePublic) return;
					document.getElementById('custom-css').textContent =
						localStorage.getItem('jnote.customCss.v1') || '';
				} catch (error) {
					console.warn('Could not apply custom CSS:', error);
				}
			})();
		</script>
	</head>
	<body class="bluecolor" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
