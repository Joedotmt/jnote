<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="description" content="A private, encrypted notes app." />
    <meta name="theme-color" content="#121316" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%sveltekit.assets%/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="JNote" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.css" rel="stylesheet" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.9.7/dist/cdn/beer.min.js"></script>
    <script>
      // Self-hosted deployments: set pocketbaseUrl here (or build with VITE_POCKETBASE_URL)
      // and leave accountsOrigins empty to sign in to PocketBase directly.
      // accountsOrigins must match BRIDGE_ORIGINS + HANDOFF_ORIGINS on the account site.
      window.JNOTE_CONFIG = Object.assign(
        {
          accountsOrigin: 'https://accounts.joe.mt',
          accountsOrigins: [
            'https://joe.mt',
            'https://notes.joe.mt',
            'http://localhost:5173',
            'http://localhost:4173',
            'http://127.0.0.1:5173',
            'http://127.0.0.1:4173'
          ]
        },
        window.JNOTE_CONFIG
      );
      // The account site serves only its own origins, so other hosts skip the script.
      window.__joeAccountsReady = new Promise((resolve) => {
        const config = window.JNOTE_CONFIG;
        if (!(config.accountsOrigins || []).includes(window.location.origin)) {
          resolve(false);
          return;
        }
        const script = document.createElement('script');
        script.src = config.accountsOrigin + '/client.js';
        script.onload = () => resolve(true);
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    </script>
    %sveltekit.head%
    <style id="custom-css"></style>
    <script>
      (() => {
        try {
          document.getElementById('custom-css').textContent = localStorage.getItem('jnote.customCss.v1') || '';
        } catch (error) {
          console.warn('Could not apply custom CSS:', error);
        }
      })();
    </script>
  </head>
  <body class="bluecolor" data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
